<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sınav – Sınav Portalı | Deneme Sınavı Çöz</title>
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="Çoklu ders destekli üniversite sınav simülatörü: deneme sınavları çöz, gelişimini takip et ve ders notlarını okuyarak sınav öncesi tekrar yap.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sınav Portalı">
  <meta property="og:title" content="Sınav Portalı – Üniversite Sınav Simülatörü ve Ders Notları">
  <meta property="og:description" content="Çoklu ders destekli üniversite sınav simülatörü: deneme sınavları çöz, gelişimini takip et ve ders notlarını okuyarak sınav öncesi tekrar yap.">
  <meta property="og:url" content="https://fatiherolbahar.github.io/sinav_portali/exam.html">
  <meta property="og:image" content="https://fatiherolbahar.github.io/sinav_portali/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sınav Portalı – Üniversite Sınav Simülatörü ve Ders Notları">
  <meta name="twitter:image" content="https://fatiherolbahar.github.io/sinav_portali/assets/og-image.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png?v=2">
  <link rel="shortcut icon" href="assets/favicon.ico?v=2">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=2">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="btn btn-back" href="index.html" aria-label="Ana Sayfaya Dön"><span>←</span><span class="tx">Ana Sayfaya Dön</span></a>
    <div class="title">
      <h1 id="courseName">Yükleniyor…</h1>
      <span class="badge" id="attemptBadge"></span>
    </div>
    <button class="btn" id="historyBtn"><span>📊</span><span class="tx">Deneme Geçmişi</span></button>
    <button class="btn btn-primary" id="finishBtn"><span>✓</span><span class="tx">Sınavı Bitir</span></button>
  </header>

  <main class="container">
    <div id="loading" class="center-msg">Sınav yükleniyor…</div>
    <div id="error" class="center-msg hidden"></div>

    <section id="examView" class="hidden">
      <div id="banner" class="banner hidden"></div>
      <div class="filterbar">
        <div class="pills" id="pills"></div>
        <label class="switch" title="Şık tıklandığı anda doğru/yanlış gösterilir">
          <input type="checkbox" id="feedbackToggle"><span class="track"></span>
          <span>Anlık Geri Bildirim</span>
        </label>
      </div>
      <div class="statusbar" id="status"></div>
      <div class="layout">
        <section class="card q-card" id="qCard"></section>
        <aside class="card palette" id="palette">
          <h3><span class="grab"></span><span>Soru Paleti</span><button class="drawer-close" id="paletteClose">✕</button></h3>
          <div class="pgrid" id="pgrid"></div>
          <div class="legend" id="legend"></div>
        </aside>
      </div>
    </section>

    <section id="resultView" class="hidden"></section>
  </main>

  <button class="fab hidden" id="paletteFab">🧭 Soru Paleti</button>
  <div class="overlay" id="overlay"></div>

  <script src="data/courses-manifest.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/exam-engine.js"></script>
</body>
</html>
