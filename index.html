<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Analizi ve Tasarımı - Sınav Simülatörü</title>
  <meta name="description" content="Sistem Analizi ve Tasarımı - 84 soruluk sınav simülatörü">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- Link önizlemesi (WhatsApp, Telegram, Twitter vb.) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Sistem Analizi ve Tasarımı - Sınav Simülatörü">
  <meta property="og:description" content="84 soruluk çalışma soruları test simülatörü. Denemeni çöz, gelişimini takip et.">
  <meta property="og:url" content="https://fatiherolbahar.github.io/sistem_analizi_tasar-m-/">
  <meta property="og:image" content="https://fatiherolbahar.github.io/sistem_analizi_tasar-m-/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://fatiherolbahar.github.io/sistem_analizi_tasar-m-/og-image.png">
  <meta name="theme-color" content="#4338ca">
  <style>
    :root {
      --accent: #4338ca;
      --accent-soft: #eceefb;
      --bg: #f4f4f2;
      --surface: #ffffff;
      --text: #1d2433;
      --muted: #667085;
      --line: #e3e3de;
      --ok: #16794c;
      --ok-soft: #e6f4ec;
      --bad: #b42318;
      --bad-soft: #fceceb;
      --warn: #b54708;
      --warn-soft: #fdf1e3;
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh;
    }
    button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

    /* Üst çubuk */
    .topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
    .topbar-in { max-width: 1040px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
    .brand img { width: 34px; height: 34px; border-radius: 8px; flex-shrink: 0; }
    .brand-title { font-size: 0.98rem; font-weight: 700; line-height: 1.2; }
    .brand-sub { font-size: 0.78rem; color: var(--muted); }
    .top-actions { display: flex; gap: 8px; }

    .btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 8px; font-size: 0.88rem; font-weight: 600; }
    .btn:hover { background: #f1f1ee; }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: #3730a3; }
    .btn-danger { color: var(--bad); }
    .btn-danger:hover { background: var(--bad-soft); }

    main { max-width: 1040px; margin: 0 auto; padding: 18px 16px 96px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }

    /* Sınav */
    .exam-grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 16px; align-items: start; }
    .progress { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 16px; }
    .progress > span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
    .q-meta { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; font-size: 0.85rem; color: var(--muted); }
    .q-meta b { color: var(--text); }
    .q-text { font-size: 1.05rem; font-weight: 600; line-height: 1.6; margin-bottom: 18px; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .opt:not(:disabled):hover { border-color: var(--accent); background: var(--accent-soft); }
    .opt-key { flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 0.82rem; font-weight: 700; color: var(--muted); }
    .opt-text { font-size: 0.95rem; padding-top: 2px; }
    .opt.correct { border-color: var(--ok); background: var(--ok-soft); }
    .opt.correct .opt-key { background: var(--ok); border-color: var(--ok); color: #fff; }
    .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
    .opt.wrong .opt-key { background: var(--bad); border-color: var(--bad); color: #fff; }
    .opt:disabled { cursor: default; color: inherit; }
    .feedback { margin-top: 14px; padding: 11px 14px; border-radius: 8px; font-size: 0.92rem; font-weight: 600; }
    .feedback.ok { background: var(--ok-soft); color: var(--ok); }
    .feedback.bad { background: var(--bad-soft); color: var(--bad); }
    .nav-row { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }

    /* Soru listesi */
    .side-title { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 0.92rem; margin-bottom: 12px; }
    .side-count { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
    .palette { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; max-height: 360px; overflow-y: auto; }
    .pbtn { aspect-ratio: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; font-size: 0.8rem; font-weight: 600; color: var(--muted); }
    .pbtn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
    .pbtn.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
    .pbtn.active { outline: 2px solid var(--accent); outline-offset: 1px; }
    .legend { display: flex; gap: 12px; margin-top: 12px; font-size: 0.75rem; color: var(--muted); }
    .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

    /* Mobil alt çubuk */
    .bottombar { display: none; }
    .sheet-backdrop { display: none; }

    /* Sonuç */
    .score-box { text-align: center; padding: 26px 12px 22px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
    .score-kicker { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
    .score-num { font-size: 3.2rem; font-weight: 800; line-height: 1.15; margin: 4px 0; }
    .score-msg { color: var(--muted); font-size: 0.95rem; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
    .stat { border: 1px solid var(--line); border-radius: 8px; padding: 12px 6px; text-align: center; }
    .stat b { display: block; font-size: 1.4rem; line-height: 1.2; }
    .stat span { font-size: 0.78rem; color: var(--muted); font-weight: 600; }
    .stat.ok b { color: var(--ok); } .stat.bad b { color: var(--bad); } .stat.warn b { color: var(--warn); }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

    /* Geçmiş */
    .page-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    .page-head h2 { font-size: 1.15rem; }
    .chart { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding: 6px 0 0; overflow-x: auto; }
    .chart-col { flex: 0 0 auto; min-width: 34px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 4px; }
    .chart-bar { width: 22px; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 3px; }
    .chart-col small { font-size: 0.7rem; color: var(--muted); }
    .chart-col em { font-size: 0.7rem; font-style: normal; font-weight: 700; }
    .hist-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    .hist-item { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
    .hist-item:hover { border-color: var(--accent); }
    .hist-pct { flex-shrink: 0; width: 62px; text-align: center; font-size: 1.15rem; font-weight: 800; }
    .hist-main { flex: 1; min-width: 0; }
    .hist-main b { display: block; font-size: 0.98rem; }
    .hist-main span { font-size: 0.78rem; color: var(--muted); }
    .hist-counts { font-size: 0.82rem; font-weight: 700; white-space: nowrap; }
    .c-ok { color: var(--ok); } .c-bad { color: var(--bad); } .c-warn { color: var(--warn); }
    .chev { color: var(--muted); font-size: 1.2rem; }
    .empty { text-align: center; color: var(--muted); padding: 30px 10px; }

    /* Deneme detayı */
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 12px; }
    .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 13px; font-size: 0.83rem; font-weight: 600; }
    .chip.on { background: var(--text); border-color: var(--text); color: #fff; }
    .qlist { display: flex; flex-direction: column; gap: 10px; }
    details.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
    details.qcard > summary { list-style: none; cursor: pointer; padding: 13px 14px; display: flex; gap: 10px; align-items: flex-start; }
    details.qcard > summary::-webkit-details-marker { display: none; }
    .qno { flex-shrink: 0; min-width: 34px; height: 24px; padding: 0 6px; border-radius: 6px; font-size: 0.78rem; font-weight: 700; display: flex; align-items: center; justify-content: center; color: #fff; }
    .qno.ok { background: var(--ok); } .qno.bad { background: var(--bad); } .qno.blank { background: var(--warn); }
    .qsum { flex: 1; min-width: 0; font-size: 0.9rem; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    details[open] .qsum { display: block; }
    .qbody { padding: 0 14px 14px; }
    .qbody .options { gap: 8px; margin-top: 4px; }
    .opt.static { cursor: default; }
    .tag { margin-left: auto; padding-left: 8px; flex-shrink: 0; font-size: 0.72rem; font-weight: 700; }
    .opt.correct .tag { color: var(--ok); } .opt.wrong .tag { color: var(--bad); }
    .note { padding: 11px 14px; background: var(--warn-soft); color: var(--warn); border-radius: 8px; font-size: 0.88rem; margin-top: 14px; }

    /* Tablet / mobil */
    @media (max-width: 860px) {
      .exam-grid { grid-template-columns: 1fr; }
      #palettePanel {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; border-radius: 16px 16px 0 0;
        transform: translateY(105%); transition: transform .25s; max-height: 72vh; overflow-y: auto; padding-bottom: 24px;
      }
      #palettePanel.open { transform: none; }
      .palette { grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); max-height: none; }
      .sheet-backdrop.open { display: block; position: fixed; inset: 0; background: rgba(15,20,35,.45); z-index: 30; }
      .bottombar {
        display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface);
        border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); gap: 8px;
      }
      .bottombar .btn { flex: 1; padding: 13px 8px; }
      .bottombar .btn-mid { flex: 0 0 auto; padding: 13px 14px; }
      .nav-row { display: none; }
    }
    @media (max-width: 600px) {
      main { padding: 12px 10px 100px; }
      .panel { padding: 16px; }
      .topbar-in { padding: 8px 10px; }
      .brand-sub { display: none; }
      .top-actions .btn { padding: 8px 11px; font-size: 0.82rem; }
      .q-text { font-size: 1rem; }
      .opt { padding: 12px 11px; gap: 10px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .score-num { font-size: 2.7rem; }
      .btn-row .btn { flex: 1 1 100%; padding: 13px; }
      .hist-item { padding: 12px; gap: 10px; }
      .hist-pct { width: 52px; font-size: 1.05rem; }
      .hist-counts { display: none; }
    }
  </style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <img src="logo.svg" alt="Logo">
      <div>
        <div class="brand-title">Sistem Analizi ve Tasarımı</div>
        <div class="brand-sub" id="brandSub">Sınav simülatörü · 84 soru</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn" id="btnHistory" onclick="openHistory()">Geçmiş</button>
      <button class="btn btn-primary" id="btnFinish" onclick="finishExam()">Bitir</button>
    </div>
  </div>
</header>

<main>
  <!-- Sınav -->
  <section id="examScreen" class="exam-grid">
    <div class="panel">
      <div class="progress"><span id="progressBar"></span></div>
      <div class="q-meta">
        <span id="qNumber"></span>
        <span id="qAnswered"></span>
      </div>
      <div class="q-text" id="qText"></div>
      <div class="options" id="optionsList"></div>
      <div class="feedback" id="feedback" hidden></div>
      <div class="nav-row">
        <button class="btn" id="prevBtn" onclick="prevQuestion()">Önceki</button>
        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">Sonraki</button>
      </div>
    </div>

    <aside class="panel" id="palettePanel">
      <div class="side-title"><span>Sorular</span><span class="side-count" id="answeredCount"></span></div>
      <div class="palette" id="paletteGrid"></div>
      <div class="legend">
        <span><i style="background:var(--ok)"></i>Doğru</span>
        <span><i style="background:var(--bad)"></i>Yanlış</span>
        <span><i style="background:#fff;border:1px solid var(--line)"></i>Boş</span>
      </div>
    </aside>
  </section>

  <!-- Sonuç -->
  <section id="resultsScreen" hidden>
    <div class="panel">
      <div class="score-box">
        <div class="score-kicker" id="resTitle"></div>
        <div class="score-num" id="resPercent"></div>
        <div class="score-msg" id="resMsg"></div>
      </div>
      <div class="stats">
        <div class="stat"><b>84</b><span>Toplam</span></div>
        <div class="stat ok"><b id="resCorrect">0</b><span>Doğru</span></div>
        <div class="stat bad"><b id="resWrong">0</b><span>Yanlış</span></div>
        <div class="stat warn"><b id="resBlank">0</b><span>Boş</span></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="openDetail(lastSavedIndex)">Soruları incele</button>
        <button class="btn" onclick="startNewAttempt()" id="newAttemptBtn">Yeni deneme</button>
        <button class="btn" onclick="openHistory()">Geçmiş</button>
      </div>
    </div>
  </section>

  <!-- Geçmiş -->
  <section id="historyScreen" hidden>
    <div class="page-head">
      <h2>Gelişim geçmişi</h2>
      <div class="btn-row">
        <button class="btn" onclick="backToExam()">Sınava dön</button>
        <button class="btn btn-danger" onclick="clearHistory()" id="clearAllBtn">Tümünü sil</button>
      </div>
    </div>
    <div class="panel" id="chartPanel">
      <div class="side-title"><span>Başarı grafiği</span><span class="side-count">Deneme başına doğru yüzdesi</span></div>
      <div class="chart" id="chart"></div>
    </div>
    <div class="hist-list" id="historyList"></div>
  </section>

  <!-- Deneme detayı -->
  <section id="detailScreen" hidden>
    <div class="page-head">
      <button class="btn" onclick="openHistory()">← Geçmiş</button>
      <button class="btn btn-danger" onclick="deleteAttempt()" id="deleteAttemptBtn">Bu denemeyi sil</button>
    </div>
    <div class="panel">
      <div class="score-kicker" id="dTitle"></div>
      <div class="score-num" id="dPercent" style="font-size:2.4rem"></div>
      <div class="score-msg" id="dDate"></div>
      <div class="stats" style="margin:16px 0 0">
        <div class="stat"><b id="dTotal">84</b><span>Toplam</span></div>
        <div class="stat ok"><b id="dCorrect"></b><span>Doğru</span></div>
        <div class="stat bad"><b id="dWrong"></b><span>Yanlış</span></div>
        <div class="stat warn"><b id="dBlank"></b><span>Boş</span></div>
      </div>
      <div id="dNote" class="note" hidden>Bu deneme eski sürümde kaydedildiği için soru bazlı detay yok. Yeni denemelerde detaylar saklanır.</div>
    </div>
    <div id="dQuestions" hidden>
      <div class="chips" id="chips"></div>
      <div class="qlist" id="qlist"></div>
    </div>
  </section>
</main>

<!-- Mobil alt çubuk -->
<div class="bottombar" id="bottomBar">
  <button class="btn" id="mPrev" onclick="prevQuestion()">Önceki</button>
  <button class="btn btn-mid" onclick="togglePalette()" id="mList">Sorular</button>
  <button class="btn btn-primary" id="mNext" onclick="nextQuestion()">Sonraki</button>
</div>
<div class="sheet-backdrop" id="backdrop" onclick="togglePalette(false)"></div>

<script>
// 84 Soru ve Cevap Veri Seti (Eksiksiz)
const questionsData = [
  { id: 1, text: "Bir üniversitede ders seçimi, danışman onayı ve kontenjan kontrolü ayrı yazılımlarda çalışmaktadır. Her biri doğru sonuç üretse de onaylı dersler öğrencinin kesin kaydına geçmemektedir. Öncelikle hangi sorunun incelenmesi gerekir?", options: { A: "Kullanıcıya sunulan ders seçim özetinin daha ayrıntılı hazırlanması", B: "Danışman onayı için belirlenen yetki seviyelerinin yeniden tanımlanması", C: "Her modülün kendi içinde kullandığı alan adlarının standartlaştırılması", D: "Alt sistemler arasındaki veri ve işlem bağlantılarının doğru kurulup kurulmadığı", E: "Kontenjan yönetiminin diğer işlevlerden bağımsız raporlanması" }, answer: "D" },
  { id: 2, text: "Kendi performansından haberdar olmayan, geçmişteki eyleminin gelecekteki eylemini etkilemediği ve kendi kontrolünü sağlayacak bir geri besleme mekanizması bulunmayan sistem türü aşağıdakilerden hangisidir?", options: { A: "Kapalı-döngülü sistem", B: "Açık-döngülü sistem", C: "Stokastik sistem", D: "Dinamik sistem", E: "Girdileri sürekli izleyen ancak sonuçları değerlendirmeyen sistem" }, answer: "B" },
  { id: 3, text: "Üretim ekranında “120” görülüyor; başka bir ekranda bunun “C hattında bugün üretilen parça sayısı” olduğu belirtiliyor. İkinci ifade hangi dönüşüm sonucunda oluşmuştur?", options: { A: "Bağlamın kaldırılmasıyla sayıların daha güvenilir hâle gelmesi", B: "Sayının bağlam ve anlam kazanmasıyla veriden bilgiye dönüşüm", C: "Ham ölçümün yönetim kararı verilmeden bilgelik aşamasına geçmesi", D: "Anlamlandırılmış sayının doğrudan uzman kuralına dönüşmesi", E: "Ölçümün kullanıcı davranışı değişmeden süreç kontrolüne dönüşmesi" }, answer: "B" },
  { id: 4, text: "Kapalı-döngülü sistemlerde, sistem çıktısından elde edilen veriyi arzu edilen standart/kriter ile karşılaştırıp bir sonraki işlem öncesinde düzeltme kararı veren sistem işlevi aşağıdakilerden hangisidir?", options: { A: "Girdi parametresi", B: "Geri besleme (Feedback)", C: "Arayüz dönüştürmesi", D: "Entropi dengesi", E: "Kayıtların yalnızca arşivlenmesi" }, answer: "B" },
  { id: 5, text: "Bir mağazada her satış kasa sistemine kaydedilmekte, müdüre ise ürün grubuna göre haftalık kârlılık özeti sunulmaktadır. Bu iki görevi en uygun biçimde hangi sistemler karşılar?", options: { A: "Satış kayıtları için KDS, haftalık özet için VİS", B: "Satış kayıtları için ofis otomasyonu, haftalık özet için YBS", C: "Satış kayıtları için YBS, haftalık kârlılık özeti için VİS", D: "Satış kayıtları için VİS, haftalık yönetim raporu için YBS", E: "Satış kayıtları için VİS, haftalık özet için uzman sistem" }, answer: "D" },
  { id: 6, text: "Termodinamik disiplininden sistem teorisine aktarılan; kapalı sistemlerde kaçınılmaz olan ve sistemdeki dengenin bozulması, düzensizlik ve karmaşanın artması sürecine ne ad verilir?", options: { A: "Sinerji", B: "Entropi", C: "Holizm", D: "Emergence", E: "Sistem sınırının genişletilmesi" }, answer: "B" },
  { id: 7, text: "Bir yazılım geliştirme ekibinde kullanıcı gereksinimleri netleştirilmeden ekranlar tasarlanıyor, sonradan ortaya çıkan kurallar yüzünden ekranlar tekrar yapılıyor. Yaşam döngüsüne göre esas sorun nedir?", options: { A: "Sistem çalışırken yardım masası kurulmasının önlenmesi", B: "Sistem kullanıldıktan sonra yeni ihtiyacın belirlenmesi", C: "Kodlama bitmeden kullanıcı kabulünün yapılıyor olması", D: "Uygulamaya geçişten önce veri aktarımının planlanması", E: "Analizde belirlenmesi gereken gereksinimlerin tasarımdan önce açıklığa kavuşturulmaması" }, answer: "E" },
  { id: 8, text: "İşletmeler gibi açık sistemlerin yok oluşa yönelen entropi sürecini durdurabilmeleri ve yaşamlarını sürdürebilmeleri aşağıdakilerden hangisini kazanmaları ile mümkündür?", options: { A: "Pozitif entropi", B: "Negatif entropi", C: "Azaltmacı yapı", D: "Deterministik denge", E: "Kontrol mekanizmasının tamamen kaldırılması" }, answer: "B" },
  { id: 9, text: "Çevrim içi sınav sistemi, geçersiz dosya biçiminde yüklemeyi reddetmiş, gerekçeyi göstermiş ve başarısız denemeyi kaydetmiştir. Bu olayın çıktı bakımından doğru değerlendirmesi hangisidir?", options: { A: "Hata kaydının yalnızca ham girdi olarak tanımlanması", B: "Çıktının yalnızca başarılı dosya yükleme belgesinden ibaret olması", C: "Dosyanın kaydedilmemesi nedeniyle işlem akışının başlamamış kabul edilmesi", D: "Sistem, başarısızlığa rağmen uyarı ve kayıt çıktıları üretmiştir.", E: "Ret mesajının sadece kontrol işlemi sayılıp çıktı kapsamı dışında bırakılması" }, answer: "D" },
  { id: 10, text: "İşletme sistemlerinin yaşamını devam ettirmek için kullandığı 7M girdileri arasında aşağıdakilerden hangisi yer almaz?", options: { A: "Man (İnsan) & Material (Malzeme)", B: "Method (Metod) & Machine (Makine)", C: "Money (Para) & Mind (Bilgi)", D: "Marketing (Pazarlama) & Mechanism (Mekanizma)", E: "Money (Para) ve Management (Yönetim)" }, answer: "D" },
  { id: 11, text: "Bir hastanede hastanın belirti ve ölçümleri bir araya getirilmiştir. Sistem, uzman tarafından tanımlanan tıbbi protokole dayanarak “ek tetkik istenmeli” önerisi üretmektedir. Bu öneri DIKW içinde hangi düzeye karşılık gelir?", options: { A: "Uzbilgi; ölçümlere kural ve deneyim uygulanmıştır.", B: "Özetleme; vakalardan dönemlik istatistik tablosu çıkarılması", C: "Veri; ölçümlerin tekil değerler halinde saklanması", D: "Bilgelik; etik ilkelerle uzun vadeli tedavi amacı belirlenmesi", E: "Bilgi; bulguların hasta kaydıyla ilişkilendirilip protokol uygulanmadan sunulması" }, answer: "A" },
  { id: 12, text: "Bilgi Piramidi'nde yer alan kavramların tabandan tavana doğru doğru sıralanışı aşağıdakilerden hangisidir?", options: { A: "Veri — Bilgi — Uzbilgi — Bilgelik", B: "Bilgi — Veri — Bilgelik — Uzbilgi", C: "Veri — Uzbilgi — Bilgi — Bilgelik", D: "Bilgelik — Uzbilgi — Bilgi — Veri", E: "Bilgi — Veri — Uzbilgi — Bilgelik" }, answer: "A" },
  { id: 13, text: "Bir belediye hizmet merkezinin başvuru sayısını sayması ile “personel sayısı yüzde 20 artırılırsa bekleme süresi nasıl değişir?” hesabını yapması farklı işlevlerdir. İkinci görev öncelikle hangi tür sisteme uygundur?", options: { A: "Varsayımlarla alternatif sonuçları karşılaştıran Karar Destek Sistemi", B: "Dönemlik toplam ve hedef sapmalarını raporlayan Yönetim Bilişim Sistemi", C: "Tekil başvuruları kaydeden Veri İşleme Sistemi", D: "Belirli kurallara göre otomatik sınıflama yapan Uzman Sistem", E: "Belge dolaşımı ve takvim akışını sağlayan Ofis Otomasyonu" }, answer: "A" },
  { id: 14, text: "Henüz işlenmemiş; semboller, harfler, rakamlar veya işaretlerden oluşan ham gözlem değerlerine ne ad verilir?", options: { A: "Bilgi", B: "Veri (Data)", C: "Uzbilgi", D: "Bilişim", E: "Dönemlik yönetim raporları" }, answer: "B" },
  { id: 15, text: "Bir kurumun yeni başvuru sisteminde proje çekirdek ekibi kuruluyor; sorunun sınırı, amaç, kısıtlar ve seçeneklerin yarar/maliyetleri belirlenerek yönetimden devam kararı isteniyor. Bu çalışma hangi aşamaya aittir?", options: { A: "Planlama; projenin başlatılıp başlatılmayacağına dayanak hazırlanır.", B: "Analiz; mevcut sistemi ayrıntılı gözlemleyerek ihtiyaç raporu hazırlanır.", C: "Programlama; modüller hazırlanıp test edilir.", D: "İmplementasyon; veri aktarımı ile kullanıcı kabulü tamamlanır.", E: "Tasarım; veri ve süreç modelleri seçilip teknik çözüm kesinleştirilir." }, answer: "A" },
  { id: 16, text: "Ham verilerin belirli bir amaç doğrultusunda işlenmesi, düzenlenmesi ve anlamlı bir yapıya kavuşturularak değer katılması sonucu elde edilen kavram hangisidir?", options: { A: "Veri", B: "Bilgi (Information)", C: "Donanım", D: "Veri tabanı", E: "Uzmanların deneyimiyle oluşturulmuş karar kuralları" }, answer: "B" },
  { id: 17, text: "Kütüphane yazılımında “kitap”, “ISBN”, “ödünç verme” ve “iade süresi geçmiş” ifadeleri geçmektedir. Bunların doğru kavramsal sıralaması hangisidir?", options: { A: "Öğe – özellik – faaliyet – durum", B: "Durum – özellik – faaliyet – öğe", C: "Öğe – durum – faaliyet – özellik", D: "Öğe – faaliyet – özellik – durum", E: "Özellik – öğe – faaliyet – durum" }, answer: "A" },
  { id: 18, text: "Veri ve bilginin ötesinde; uygulama, deneyim ve sezgilerle pekişmiş, neyin doğru veya yanlış olduğunu söyleyen ve karar vermeyi yönlendiren kavram hangisidir?", options: { A: "Uzbilgi (Knowledge)", B: "Veri elemanı", C: "Rapor", D: "Yazılım", E: "Ham kayıtların tutulduğu işlem günlüğü" }, answer: "A" },
  { id: 19, text: "Bir sağlık kurumunda iki tedavi seçeneği klinik açıdan benzer sonuçlar üretmektedir. Yönetim, hasta haklarını, uzun dönem etkileri ve kurumun değerlerini de dikkate alarak karar vermektedir. DIKW bakımından öne çıkan aşama hangisidir?", options: { A: "Bilgi; klinik bulguların hasta kaydıyla ilişkilendirilmesi", B: "Bilgelik; etik değerler ve amaçlar da değerlendirmeye katılmıştır.", C: "Özetleme; klinik sonuçların tek bir raporda birleştirilmesi", D: "Uzbilgi; protokolün sonuç üretmek için doğrudan uygulanması", E: "Veri; hastaların yalnızca tekil ölçümlerinin toplanması" }, answer: "B" },
  { id: 20, text: "Bir bilginin 'yönetimsel bir değer' taşıyabilmesi için sahip olması gereken temel özellikler arasında aşağıdakilerden hangisi sayılamaz?", options: { A: "Doğru ve güncel olması", B: "İstenilen zamanda kolayca ulaşılabilir olması", C: "Sınırsız miktarda ve karmakarışık sunulması", D: "Anlaşılır, öz ve eksiksiz olması", E: "Karar vericinin amacına göre özetlenmesi" }, answer: "C" },
  { id: 21, text: "Bir hastanenin uzmandan aldığı “EĞER belirtiler A ve B ise öncelikle C testini öner” kurallarını çalıştıran uygulaması vardır. Kararın oluşmasında belirleyici bileşen hangisidir?", options: { A: "Uzmanın kural tanımlarını saklayan uzbilgi tabanı", B: "Verilerin dönemsel toplamlarını üreten raporlama bileşeni", C: "Çıkan sonucu kullanıcıya aktaran arayüz", D: "Uzbilgi tabanındaki kuralları işleten çıkarım mekanizması", E: "Farklı alternatiflerin maliyetlerini karşılaştıran model bileşeni" }, answer: "D" },
  { id: 22, text: "Yönetim piramidinin en üstünde yer alan Stratejik Planlama kademesindeki yöneticilerin kararlarında öncelikli olarak ihtiyaç duyduğu bilgi türü hangisidir?", options: { A: "Ayrıntılı bilgi", B: "Öz bilgi (Özet bilgi)", C: "Rutin işlem bilgisi", D: "Teknik uygulama bilgisi", E: "Uzun dönemli kararları yalnızca tekil işlem fişlerine dayandırma" }, answer: "B" },
  { id: 23, text: "Bir sistemin sorunları ve kullanıcı ihtiyaçları belgelenmiş; şimdi yeni sistemde hangi veri yapısının, işlem akışının ve teknolojik çözümün kullanılacağı kararlaştırılmaktadır. Hangi aşamada bulunulmaktadır?", options: { A: "Tasarım", B: "Analiz", C: "İmplementasyon", D: "Planlama", E: "Kullanım ve izleme" }, answer: "A" },
  { id: 24, text: "Yönetim piramidinde aşağıdan yukarıya doğru çıkıldıkça bilgi kaynaklarının kullanım eğilimi nasıl değişmektedir?", options: { A: "İç kaynaklı bilgi kullanımı artar.", B: "Dış kaynaklı ve çevre odaklı bilgi kullanımı artar.", C: "Ayrıntılı bilgiye ihtiyaç artar.", D: "Bilgi ihtiyacı tamamen ortadan kalkar.", E: "Kararların yalnızca geçmiş işlem kayıtlarıyla sınırlandırılması" }, answer: "B" },
  { id: 25, text: "İki depo soğutma cihazından ilki her gün saat 18.00’de sabit süre çalışmaktadır. İkincisi ölçülen sıcaklık hedefi aştığında çalışıp hedefe gelince durmaktadır. İkinci cihazı ayırt eden temel özellik nedir?", options: { A: "Sıcaklığı ölçerek sonucu kaydetmesi fakat çalışma düzenini sabit tutması", B: "Soğutmayı düzenleyen kararın yalnızca kullanıcı tarafından elle verilmesi", C: "Çalışma süresinin önceden tanımlanmış tek bir süreye bağlı olması", D: "Belirlenmiş saat geldiğinde ölçümden bağımsız çalışması", E: "Çıktıyla ilgili ölçümü kullanarak sonraki çalışmasını değiştirmesi" }, answer: "E" },
  { id: 26, text: "Yönetim piramidinin en alt seviyesinde yer alan Operasyonel Kontrol (Alt Yönetim) kademesinin temel odak noktası aşağıdakilerden hangisidir?", options: { A: "5-10 yıllık stratejik planlama yapma", B: "Günlük rutin işlerin denetimi ve ayrıntılı iç kaynaklı bilgi kullanımı", C: "Şirket birleşme kararları alma", D: "Dış çevre tehditlerini analiz etme", E: "Yeni pazarlara giriş için beş yıllık strateji geliştirilmesi" }, answer: "B" },
  { id: 27, text: "Bir banka kredi ekranında müşterinin doğrulanmış aylık geliri 54.000 TL iken 5.400 TL kaydedilmiştir. Hesaplama aracı düzgün çalışsa da kredi reddedilmiştir. Öncelikle hangi sorun düzeltilmelidir?", options: { A: "Bilgiye yalnızca yetkili kişilerin erişip erişemediği", B: "Verinin elde edilme maliyetinin sağladığı yararı aşıp aşmadığı", C: "Raporda gereksiz ayrıntı bulunup bulunmadığı", D: "Girdi verisinin doğruluğu; yanlış girdi yanlış karara yol açmıştır.", E: "Verilerin karar zamanında yeterince güncel olup olmadığı" }, answer: "D" },
  { id: 28, text: "Sanayi toplumundan Bilişim Toplumuna geçişte sosyo-ekonomik yapıda meydana gelen temel değişim aşağıdakilerden hangisidir?", options: { A: "Maddi sermaye ve beden gücünün ön plana çıkması", B: "Bilgi üretimi ve beşeri sermayenin temel üretken güç haline gelmesi", C: "Bilişim teknolojilerinin kullanımının azalması", D: "Kol gücüne dayalı imalatın tek odak olması", E: "İşletmelerin bilgi alışverişinden tamamen vazgeçmesi" }, answer: "B" },
  { id: 29, text: "Bir bankada sistem, üç farklı kredi politikasının geri ödeme riski üzerindeki etkisini hesaplıyor; son kararı kredi komitesi veriyor. Bu kullanımın doğru yorumu hangisidir?", options: { A: "KDS yalnızca günlük para yatırma kayıtlarını tutar.", B: "Komite karar verdiğinden sistemde bilgi veya model kullanılmamıştır.", C: "KDS seçeneklerin sonuçlarını görünür kılar; karar yetkisi yönetimde kalır.", D: "KDS bütün yönetsel yargıları kaldırıp komitenin yerine geçer.", E: "Sistem hiçbir modele ihtiyaç duymadan uzman kararını zorunlu üretir." }, answer: "C" },
  { id: 30, text: "McLeod'un bilgisayara dayalı bilişim sistemleri (BDBS) sınıflandırmasında yer alan ve işletme dışına (müşteriler, satıcılar vb.) veri sağlama yükümlülüğü bulunan tek alt sistem hangisidir?", options: { A: "Yönetim Bilişim Sistemleri (YBS)", B: "Karar Destek Sistemleri (KDS)", C: "Veri İşleme Sistemi (TPS)", D: "Uzman Sistemler", E: "Ofis Otomasyon Sistemi (OAS)" }, answer: "C" },
  { id: 31, text: "Bir hastane bilgi sistemi test ortamında çalışmaktadır. Hasta kayıtları eski sistemden yeni sisteme taşınmakta, personele eğitim verilmektedir ve kullanıcı kabulü yapılmaktadır. Bu görevler hangi aşamanın göstergesidir?", options: { A: "Yalnızca mevcut sistemin incelendiği analiz", B: "Canlı kullanım sonrası bakım taleplerinin izlendiği dönem", C: "Yeni arayüzün çizildiği tasarım", D: "İmplementasyon (uygulamaya geçiş)", E: "İhtiyaçların ilk kez tanımlandığı planlama" }, answer: "D" },
  { id: 32, text: "Organizasyondaki her yöneticiye kendi sorumluluk alanında karar almak, plan yapmak ve kontrol etmek için ihtiyaç duyduğu özet bilgiyi sağlayan sistem hangisidir?", options: { A: "Yönetim Bilişim Sistemleri (YBS / MIS)", B: "Ofis Otomasyonu", C: "İşlem Tablosu", D: "Veri İşleme Sistemi", E: "Uzman Sistemler (US)" }, answer: "A" },
  { id: 33, text: "Bir işletme hem tedarikçi ve müşterileriyle bilgi alışverişi yapıyor hem de kalite sonuçlarına göre üretim ayarlarını değiştiriyor. Bu iki durum sırasıyla hangi farklı özelliği gösterir?", options: { A: "Çevreyle etkileşmeyen sistem ve açık döngülü kontrol", B: "Çevreyle etkileşen sistem ve geri beslemesiz kontrol", C: "Çevreyle etkileşmeyen sistem ve geri beslemeli kontrol", D: "Statik sistem modeli ve kontrol verisi kullanmayan işlem", E: "Açık sistem olma ve geri beslemeli kontrol kullanma" }, answer: "E" },
  { id: 34, text: "Yapısal olmayan veya yarı-yapısal doğaya sahip karmaşık problemleri çözmede, veri tabanındaki veriler ile matematiksel modelleri birleştirerek karar vericiye yardımcı olan etkileşimli sistem hangisidir?", options: { A: "Veri İşleme Sistemi", B: "Karar Destek Sistemi (KDS / DSS)", C: "Kelime İşlemci", D: "Muhasebe Paket Programı", E: "Ofis Otomasyon Sistemi (OAS)" }, answer: "B" },
  { id: 35, text: "Bir lojistik müdürü karar vermek için dakikalık konum verisi istemektedir; hazırlanan rapor tüm bilgileri doğru içermesine karşın her akşam gönderilmektedir. Asıl sorun hangi bilgi niteliğindedir?", options: { A: "Veriye sadece yetkili kişilerin erişmesi", B: "Verinin doğru kaynak tarafından üretilmesi", C: "Veri toplama maliyetinin azaltılması", D: "Raporda yalnızca gereken göstergelerin yer alması", E: "Zamanında sağlanma ve güncellik" }, answer: "E" },
  { id: 36, text: "Herbert Simon'a göre problem çözme ve karar verme süreci hangi 4 aşamadan oluşmaktadır?", options: { A: "Planlama — Kodlama — Test — Teslim", B: "Araştırma (Intelligence) — Tasarım (Design) — Seçim (Choice) — Gözden Geçirme (Review)", C: "Girdi — Süreç — Çıktı — Kontrol", D: "Veri — Bilgi — Uzbilgi — Bilgelik", E: "Veri Toplama — Test — Arşivleme — Sistem Kapatma" }, answer: "B" },
  { id: 37, text: "Bir e-ticaret firması yeni bir ERP satın almıştır. Sipariş, stok ve muhasebe bölümleri ayrı kayıt tuttuğundan veriler çelişmektedir. Sistemin hedeflenen yararı üretmemesinin temel nedeni nedir?", options: { A: "Hazır paketin tüm süreçler için otomatik olarak uygun kabul edilmesi", B: "Ortak veri tanımları bulunmadan kullanıcı eğitimine ağırlık verilmesi", C: "Sistem verilerinin her işlevde yeniden bağımsız olarak girilmesi", D: "Ortak veri ve süreç bütünleşmesinin kurulmamış olması", E: "İş akışları birbirine bağlanmadan yalnızca rapor görünümünün yenilenmesi" }, answer: "D" },
  { id: 38, text: "Gory ve Scott-Morton'ın KDS Matrisinde; 'Yeni fabrika kurma' veya 'Yeni ürün planlama' kararları hangi yönetim seviyesi ve karar yapısı kesişiminde yer alır?", options: { A: "Operasyonel — Yapısal", B: "Stratejik — Yarı-yapısal", C: "Yönetimsel — Yapısal", D: "Operasyonel — Yapısal olmayan", E: "Operasyonel — Yarı-yapısal" }, answer: "B" },
  { id: 39, text: "Bir üniversitenin öğrenci sistemi kullanıma açılmıştır. Kullanıcılar yardım masasına sorun bildirmekte ve yeni ihtiyaçlar için iyileştirme talepleri toplanmaktadır. Döngünün hangi aşamasına örnektir?", options: { A: "Çekirdek ekibin kurulduğu planlama", B: "Yeni sistem şemasının hazırlandığı tasarım", C: "Kullanım ve izleme", D: "Sadece modüllerin yazıldığı programlama", E: "Sistem teklifinin ilk kez yazıldığı başlangıç" }, answer: "C" },
  { id: 40, text: "Turban'ın kavramsal Karar Destek Sistemi modelinde; uç kullanıcı ile diğer sistem bileşenleri arasındaki iletişimi kuran arayüz yazılımına ne ad verilir?", options: { A: "Veri yöneticisi", B: "Model yöneticisi", C: "Diyalog yöneticisi", D: "Çıkarsama makinesi", E: "İşlem kayıt yöneticisi" }, answer: "C" },
  { id: 41, text: "Bir kargo uygulamasında yalnızca “paket teslim edildi” bilgisini saklama seçeneği düşünülmektedir. Oysa kullanıcıya gecikmenin kaynağını açıklama hedefi vardır. Sistemin kapsamı açısından en yerinde karar hangisidir?", options: { A: "Analizi yalnızca müşterinin gördüğü teslim ekranıyla sınırlamak", B: "Mevcut olay kayıtlarını incelemeden yeni rapor türlerini zorunlu tutmak", C: "Gecikmeleri yalnızca teslim personelinin açıklamasıyla belirlemek", D: "Sistem sınırını gecikme analizinden bağımsız biçimde tüm kurumsal süreçleri içerecek kadar genişletmek", E: "Gecikmeyi açıklamak için gereken takip olayları ile işlem kurallarını da kapsamda değerlendirmek" }, answer: "E" },
  { id: 42, text: "Uzman kişilerin bilgi ve tecrübelerini depolayarak belirli bir alandaki zor problemleri çözmede insan düşünce sistemini taklit eden yapay zeka alt sistemi hangisidir?", options: { A: "Uzman Sistemler (Expert Systems)", B: "Veri İşleme Sistemi", C: "Ofis Otomasyonu", D: "İş İstasyonu", E: "İstemci–sunucu ağ sistemi" }, answer: "A" },
  { id: 43, text: "Bir yönetici çok sayıda çalışanın tekil mesai kayıtlarını değil, departman başına aylık fazla mesai toplamı ve hedef sapmasını istemektedir. Hangi işlem yönetim ihtiyacını doğrudan karşılar?", options: { A: "Kayıtların saklama alanının büyütülüp analiz yapılmaması", B: "Her çalışan için ayrı ayrıntı raporu hazırlanıp toplamların çıkarılmaması", C: "Kayıtların ilgili ölçütlere göre özetlenmesi ve karşılaştırmalı raporlanması", D: "Kayıtların yalnızca kaydedildikleri kronolojiye göre sunulması", E: "Kayıtların sadece departman adına göre sınıflandırılması" }, answer: "C" },
  { id: 44, text: "Uzman sistemin 'beyni' sayılan; uzbilgi tabanındaki kural ve gerçekleri yorumlayarak mantık yürüten ve sonuca ulaşan bileşen hangisidir?", options: { A: "Kara tahta (İşyeri)", B: "Çıkarsama Makinesi (Inference Engine)", C: "Kullanıcı Arayüzü", D: "Veri Sözlüğü", E: "Veri madenciliği aracı" }, answer: "B" },
  { id: 45, text: "Bir şirket iş akışında satınalma talebi önce birim amirine, sonra bütçe sorumlusuna gönderiliyor ve her onay zamanı saklanıyor. Bu ihtiyacı en doğrudan karşılayan uygulama hangisidir?", options: { A: "Şehir haritasındaki güzergâhları hesaplayan coğrafi sistem", B: "Elektronik belge ve onay akışı sağlayan ofis otomasyonu", C: "Sadece barkod hareketini kayıt altına alan satış terminali", D: "Hastalık teşhisine özel kural tabanlı uzman sistem", E: "Fabrika yerini matematiksel modelle seçen karar destek sistemi" }, answer: "B" },
  { id: 46, text: "Doküman hazırlama, elektronik posta, takvim yönetimi ve dosya paylaşımı gibi büro içi üretkenliği ve iletişimi artırmayı hedefleyen sistem türü hangisidir?", options: { A: "Ofis Otomasyon Sistemleri (OAS)", B: "Üst Yönetim Destek Sistemi", C: "Ağırlıklı Sıralama Analizi", D: "Veri Ambarı", E: "Kurumsal kaynak planlama sistemi" }, answer: "A" },
  { id: 47, text: "Bir yazılım projesinde ekibin her üyesi işini zamanında yapmasına rağmen gerekli belgeyi kimin hazırlayacağı, kontrolleri kimin onaylayacağı belirsizdir. Hangi uygulama sorunu doğrudan azaltır?", options: { A: "Yalnızca yazılım geliştiricilerin iş sırasını belirlediği bir plan", B: "Kullanıcıdan bağımsız yürütülen ve ara kontrolleri azaltan proje akışı", C: "Proje yöneticisinin belgeleri tek başına hazırladığı merkezi işleyiş", D: "Faaliyet, sorumlu, standart belge ve teknikleri tanımlayan ortak metodoloji", E: "Sorumlular belli olsa bile belge teslim noktalarının tanımlanmadığı çalışma" }, answer: "D" },
  { id: 48, text: "Bilişim Teknolojisinin (BT) altyapısını oluşturan ana unsurlar arasında aşağıdakilerden hangisi yer almaz?", options: { A: "Teknik mimari (Donanım, Yazılım, Ağlar)", B: "Uygulama geliştirme metodolojileri ve araçları", C: "Bilişim uzmanları ve yönetim yapısı", D: "Üretim bandındaki ham kauçuk stoğu", E: "Kurumsal ağ altyapısı ve güvenlik bileşenleri" }, answer: "D" },
  { id: 49, text: "Bir teknisyen iş yerindeki bakım taleplerinin neden geç sonuçlandığını araştırırken önce tüm gecikmeleri yazılımın yavaşlığına bağlıyor. Sistem yaklaşımıyla en uygun sonraki adım hangisidir?", options: { A: "Yazılım hızını ilk çözüm kabul edip iş akışını ikinci sıraya bırakmak", B: "İş talebinin kayıt, yönlendirme, malzeme temini ve onay bağlantılarını birlikte incelemek", C: "Gecikmeleri kullanıcı davranışlarıyla açıklayıp onay zincirini ayrı tutmak", D: "Önce arayüzleri yenileyip süreç verilerini daha sonra toplamak", E: "Bakım raporlarının biçimine odaklanıp görev aktarımını kapsam dışı bırakmak" }, answer: "B" },
  { id: 50, text: "Bilgisayar donanım mimarisinde yer alan 'Merkezi İşlem Birimi (MİB / CPU)' hangi 3 temel alt birimden oluşur?", options: { A: "Aritmetik Mantık Birimi — Bellek Birimi — Merkezi Kontrol Birimi", B: "Klavye — Ekran — Yazıcı", C: "Sabit Disk — Disket — CD-ROM", D: "İstemci — Sunucu — Ağ", E: "Sunucu — İstemci — Ağ" }, answer: "A" },
  { id: 51, text: "Bir işletmede operasyon yöneticisi günlük teslimat sapmalarını, genel müdür ise sonraki üç yılın pazar büyümesi olasılıklarını izlemektedir. Farkı en iyi açıklayan ifade hangisidir?", options: { A: "Operasyon yöneticisi işletmenin hiçbir iç verisini kullanmaz.", B: "Yönetim seviyesi, bilginin ayrıntı düzeyi ile zaman ufkunu değiştirir.", C: "Stratejik kararlar geçmiş ve geleceğe ilişkin özet bilgi gerektirmez.", D: "Üst yönetim yalnızca günlük işlem fişleri üzerinden karar verir.", E: "Yönetimin tüm seviyelerinde aynı veri derinliği yeterlidir." }, answer: "B" },
  { id: 52, text: "Büyük veri yığınları içerisinden gizli, anlamlı ve kullanılabilir bilgi ve kalıpların keşfedilmesi sürecine ne ad verilir?", options: { A: "Veri İşleme", B: "Veri Madenciliği (Data Mining)", C: "Normalizasyon", D: "Veri Girişi", E: "Ofis otomasyonu" }, answer: "B" },
  { id: 53, text: "Bir yönetici, yeni depo yeri için maliyet ve ulaşım alternatiflerini KDS’de değerlendiriyor. Veri kaynakları doğru olduğu hâlde matematiksel hesaplama modeli hatalı sonuç veriyor. Öncelikle hangi bileşen incelenmelidir?", options: { A: "Yalnızca yazıların biçimini değiştiren kelime işlemci", B: "Alternatiflerin hesaplandığı model yönetimi bileşeni", C: "Belge dolaşımını yöneten elektronik takvim", D: "İşlemlerin kaydedildiği kasa terminali", E: "Depo çevresindeki bilgisayarların fiziksel kablo rengi" }, answer: "B" },
  { id: 54, text: "Bir işin sistematik olarak 'ne, kim, nasıl ve hangi araçlarla' yapılacağının belirlenmesi sürecine ve sistem geliştirmede izlenen ilkelere ne ad verilir?", options: { A: "Metodoloji (Yöntembilim)", B: "Kodlama", C: "Benchmarking", D: "Simülasyon", E: "Günlük satış verisi" }, answer: "A" },
  { id: 55, text: "Bir proje yöneticisi CASE aracı satın aldığı için artık geliştirme metodolojisine ihtiyacı kalmadığını savunuyor. Bu düşüncedeki hata nedir?", options: { A: "CASE araçlarının yalnızca son kullanıcı desteğinde kullanılabileceği düşüncesi", B: "CASE araçları yöntem ve belgelendirmeyi destekler, metodolojinin yerine geçmez.", C: "Belgelendirme standartlarının proje sorumlularını belirlemek için yeterli olduğu düşüncesi", D: "Sistem geliştirme aşamalarının seçiminin tümüyle araç tarafından yapılabileceği düşüncesi", E: "Metodolojinin sadece programlama dilinin belirlenmesinden oluştuğu düşüncesi" }, answer: "B" },
  { id: 56, text: "Sistem analistlerin, yazılım mühendislerinin ve kullanıcıların iş sorunlarını çözmek amacıyla izlediği mantıksal sürece 'Sistem Geliştirme Yaşam Döngüsü (SGYD)' denir. Ders kapsamında ele alınan SGYD sırasıyla hangi 6 aşamadan oluşur?", options: { A: "Araştırma — Bütçeleme — Modelleme — Kodlama — Test — Teslim", B: "Planlama — Analiz — Tasarım — Programlama — İmplementasyon — Kullanım ve İzleme", C: "Problemin Tanımı — Veri Toplama — Tasarım — Test — Uygulama — Değerlendirme", D: "Strateji — Tasarım — Kodlama — Dönüştürme — Bakım — Güncelleme", E: "Planlama — Tasarım — Analiz — Kullanım — Programlama — İmplementasyon" }, answer: "B" },
  { id: 57, text: "Üniversite kayıt sistemi için bir ekip kod yazmadan önce “kimler ders seçebilir, hangi ön koşullar denetlenir, hata durumunda ne olur?” sorularını yanıtlamaktadır. Bu çalışmanın ana gerekçesi hangisidir?", options: { A: "Kullanıcı rollerini yazılım geliştirme tamamlanınca belirlemek", B: "Kullanıcı ihtiyaçlarını sonraki kabul testinde ilk kez belirlemek", C: "Sistemin yapması gerekenleri ve iş kurallarını kodlamadan önce açıklaştırmak", D: "Analiz tamamlanmadan yeni sistemin ekran düzenini kesinleştirmek", E: "Mevcut kayıtları dikkate almadan yalnızca teknik mimariyi tanımlamak" }, answer: "C" },
  { id: 58, text: "Sistem Geliştirme Yaşam Döngüsünün planlama aşamasında, proje seçeneklerinin uygulanabilirliğini ve beklenen fayda-maliyet dengesini değerlendiren çalışma aşağıdakilerden hangisidir?", options: { A: "Olurluluk (Fizibilite) Çalışması", B: "Kod İncelemesi", C: "Birim Testi", D: "Veri Akış Diyagramı", E: "Kullanıcı kabul testi" }, answer: "A" },
  { id: 59, text: "Bir kurumda sunucular, ağ ve veri güvenliği iyi yönetildiği hâlde kritik deneyimler çalışanların ayrılmasıyla kaybolmaktadır. Hangi sorumluluğun güçlendirilmesi bu eksikliğe doğrudan yöneliktir?", options: { A: "Aylık performans raporlarını oluşturan YBS işlevi", B: "Donanım, sunucu ve siber güvenlik yatırımlarını planlayan CIO işlevi", C: "Kurumsal bilgi birikimini, paylaşımını ve aktarımını yöneten CKO işlevi", D: "Günlük işlem verilerini kaydedip işleyen VİS işlevi", E: "Evrak ve takvim koordinasyonunu sağlayan ofis otomasyonu" }, answer: "C" },
  { id: 60, text: "SGYD'nin Analiz Aşamasında hazırlanan ve varolan sistemin sorunlarını, bilgi ihtiyaçlarını ve detaylı gereksinimlerini içeren temel rapor hangisidir?", options: { A: "Sistem Teklifi Raporu", B: "İhtiyaç Analizi Raporu", C: "İşletim Kılavuzu", D: "Test Spesifikasyonu", E: "Kullanım dönemi yardım masası kaydı" }, answer: "B" },
  { id: 61, text: "Bir sistem analisti, müşteri kayıtlarının düzensiz olduğu büyük problemi “satış, stok, finans ve lojistik” süreçlerine ayırıp her birini inceliyor. Bu yöntem hangi yaklaşımın uygulamasıdır?", options: { A: "Ham verilerden tekil gözlemlere dayanarak genelleme çıkarma", B: "İhtiyaçları tanımlamadan çözümü doğrudan programlama aşamasına geçirme", C: "Karmaşık sorunu yönetilebilir parçalara ayıran analitik yaklaşım", D: "Farklı iş süreçlerinin birbirleriyle ilişkisini görmezden gelme", E: "Mevcut kayıtları incelemeden yalnızca yazılım ekranlarını yenileme" }, answer: "C" },
  { id: 62, text: "Tasarım aşamasında ortaya konan mantıksal modellerin ve program spesifikasyonlarının belirlenen bir programlama dilinde kodlanarak çalışır hale getirildiği aşama hangisidir?", options: { A: "Planlama Aşaması", B: "Analiz Aşaması", C: "Programlama Aşaması", D: "İzleme Aşaması", E: "Kullanıcılara canlı ortamda eğitim verilmesi" }, answer: "C" },
  { id: 63, text: "Bir kurumda sistemin ilk kullanımında gerekli eğitim verilmeden canlı geçiş yapılmış ve kullanıcılar kritik kayıtları yanlış girmiştir. En iyi önleyici tedbir hangisidir?", options: { A: "Kullanıcının sürece uyumunu ölçmeden sistemi kabul edilmiş saymak", B: "Veri aktarımını tamamlayıp iş akışı denetimini sonraya bırakmak", C: "Canlı geçiş öncesi kullanıcı eğitimi ve kabul testinin planlanıp tamamlanması", D: "Kullanıcı kabulünü canlı kullanım sonrasına bırakmak", E: "Eğitimin yerini yalnızca teknik testlerin alacağını varsaymak" }, answer: "C" },
  { id: 64, text: "Geliştirilen bilişim sisteminin uç-kullanıcı eğitimlerinin verilmesi, sistem kabul testlerinin yapılması ve canlı işletim ortamına geçirilmesi işlemleri hangi aşamada gerçekleşir?", options: { A: "İmplementasyon (Uygulamaya Geçiş) Aşaması", B: "Planlama Aşaması", C: "Analiz Aşaması", D: "Tasarım Aşaması", E: "Alternatif proje tekliflerinin ön değerlendirmesi" }, answer: "A" },
  { id: 65, text: "Bir müşteri hizmetleri sisteminde işlem süresi hedefi 2 dakikadır. Ölçülen ortalama 4 dakika çıkmasına rağmen süreçte hiçbir değişiklik yapılmamaktadır. Geri beslemeli yönetim için hangi ek adım gerekir?", options: { A: "Ölçüm ile hedefi karşılaştırıp gecikme nedenlerine göre süreçte düzeltme yapmak", B: "Başlangıçta belirlenmiş işlem sırasını performans verisine rağmen sabit tutmak", C: "Hedef değişikliğini neden analizi yapmadan ilk çözüm kabul etmek", D: "Yalnızca günlük işlem sayısını izleyip süre sapmasını dışarıda bırakmak", E: "Ölçümü raporlayıp karar alınmasını bir sonraki döneme bırakmak" }, answer: "A" },
  { id: 66, text: "Bilişim ekibinde yer alan ve varolan sistemin sorunlarını ve bilgi ihtiyaçlarını analiz ederek iş gereksinimlerini belirleyen anahtar uzman kimdir?", options: { A: "Veritabanı Uzmanı", B: "Sistem Analisti", C: "Sistem Programcısı", D: "Ağ Operatörü", E: "Proje sponsoru" }, answer: "B" },
  { id: 67, text: "Bir perakende firması binlerce fişi tarayarak “X ürününü alanların önemli bölümü Y ürününü de alıyor” sonucuna ulaşmaktadır. Bu çıkarımın mantığı hangisidir?", options: { A: "Çıkarılan kuralı hiçbir örnekle sınamadan kesin koşul kabul etme", B: "Genel bir satınalma kuralını her tekil işleme uygulayan tümdengelim", C: "Özel gözlemleri bağlamsız biçimde kaydetme ve arşivleme", D: "Veri kayıtlarından yalnızca dönemsel toplam üretme", E: "Tekil gözlemlerden genel örüntüye ulaşan tümevarım" }, answer: "E" },
  { id: 68, text: "Sistem analisti tarafından ortaya konulan iş gereksinimlerini süreçsel, teknolojik ve organizasyonel çözümlere dönüştürerek belgelendiren bilişim uzmanı kimdir?", options: { A: "Sistem Tasarımcısı", B: "Sistem Programcısı", C: "Veri Giriş Elemanı", D: "Donanım Teknisyeni", E: "Sistem operatörü" }, answer: "A" },
  { id: 69, text: "Bir lojistik şirketi müşteri adresleriyle yol ağını, anlık trafik yoğunluğunu ve araç konumunu birleştirerek rota belirlemektedir. Karar sürecini ayırt eden teknoloji hangisidir?", options: { A: "Önceden tanımlanmış arıza kurallarından teknik öneri üreten uzman sistem", B: "Teslimat sonuçlarını aylık raporlayan yönetim bilişim sistemi", C: "Sürücülerin görev çizelgelerini eşzamanlayan ofis otomasyonu", D: "Adres ve telefonları kayıt altına alan veri işleme sistemi", E: "Coğrafi bilgi sistemiyle konumsal verinin analiz edilmesi" }, answer: "E" },
  { id: 70, text: "Bir işletmenin bilişim bölümünde sunucular günceldir; fakat sık hizmet kesintisi yaşanıyor ve kullanıcı taleplerinin çözüm süresi uzuyor. Bölümün başarısını değerlendirmek için hangi yaklaşım uygundur?", options: { A: "Hizmet kesintilerini bütçe rakamlarından bağımsız tutmak", B: "Kullanıcı beklentilerini süreç performansından ayrı değerlendirmek", C: "Teknik kaynaklarla birlikte kullanıcıya sunulan hizmetin sonuçlarını ölçmek", D: "Başarıyı yalnızca donanımın güncelliği ile değerlendirmek", E: "Hata oranları yerine yalnızca satınalma maliyetini esas almak" }, answer: "C" },
  { id: 71, text: "Bir belediye, otobüs gecikmelerini yalnızca mobil uygulamanın gösterdiği saatlerden çözmeye çalışıyor. Aracın konumu, yol durumu ve durak verisi incelenmiyor. Bu yaklaşımda hangi hata belirgindir?", options: { A: "Çıktıyı etkileyen temel girdiler ve ilişkiler analiz dışı bırakılmaktadır.", B: "Sistem sınırı ilgili tüm dış koşulları eksiksiz içermektedir.", C: "Girdi verileri doğru olduğundan süreç bağlantılarını incelemek gerekmemektedir.", D: "Veri toplama ile süreç değerlendirmesi eş zamanlı yürütülmektedir.", E: "Temel sorun yalnızca kullanıcının ekran verisini yanlış yorumlamasıdır." }, answer: "A" },
  { id: 72, text: "Bir kuruluş müşteri bilgilerindeki hataları önlemek için kimlik numarasının 11 haneli olup olmadığını girişte denetliyor. Veriyi işleme zincirinde bu uygulamanın görevi hangisidir?", options: { A: "Kayıt biçimiyle ilgili alanları denetleyen veri doğrulama", B: "Müşterileri benzer özelliklerine göre sınıflandırma", C: "Veri doğrulama; kabul edilmeden önce kurala uygunluğu kontrol etme", D: "Dönemsel toplamları kullanıcıya gösterme", E: "Siparişleri tarih sırasına göre dizme" }, answer: "C" },
  { id: 73, text: "İki tedarikçi arasında sürekli tekrarlanan sipariş ve irsaliye bilgileri, personel yeniden girmeden, standart biçimde iki şirketin uygulamaları arasında aktarılıyor. Hangi teknoloji tanımlanmıştır?", options: { A: "Sipariş belgelerini e-posta eki olarak gönderip karşı tarafta elle yeniden girmek", B: "İşletmenin kendi içindeki onayları elektronik iş akışıyla yürütmek", C: "Geçmiş sipariş verilerinden satınalma örüntüleri keşfetmek", D: "Siparişleri iki işletme arasında standart yapısal biçim yerine taranmış belgeyle iletmek", E: "Elektronik Veri Değişimi (EDI)" }, answer: "E" },
  { id: 74, text: "Bir şirket yeni bir bilişim çözümünü yalnızca en ucuz lisansı sunduğu için seçiyor. Kullanıcı eğitimi, veri dönüşümü ve mevcut süreçlerle uyum değerlendirilmemiştir. Hangi risk ön plandadır?", options: { A: "Teknoloji seçiminin işletme ihtiyaçları ve organizasyonel değişimden koparılması", B: "Teknik koşullar tamamlandığında kullanıcı uyumunu otomatik varsaymak", C: "Organizasyonel değişim gereksinimini değerlendirmeyi projenin sonuna bırakmak", D: "Lisans fiyatını tek karar ölçütü kabul edip süreç uyumunu ikinci plana bırakmak", E: "Veri dönüşümünü maliyet dışı ve risksiz kabul etmek" }, answer: "A" },
  { id: 75, text: "Ürün hatalarını izleyen bir sistemde sadece hata kodları arşivleniyor; hangi modelde ve ne sıklıkla görüldüğü raporlanmıyor. Bilgi kalitesini karar açısından artıracak iyileştirme hangisidir?", options: { A: "Kodları ürüne bağlamadan toplam kayıt sayısını göstermek", B: "Hata kayıtlarını ürün modeliyle ilişkilendirip görülme sıklıklarını raporlamak", C: "Kayda ilişkin yalnızca depolama kapasitesini artırmak", D: "Hataları sadece oluş tarihine göre dizmek", E: "Kayıtları tekil ve yorumsuz biçimde rapora aktarmak" }, answer: "B" },
  { id: 76, text: "Bir üretim şirketi “hangi parçadan ne kadar ve ne zaman gerekiyor?” sorusunu çözen uygulamadan, finans ve insan kaynaklarını da ortak veri içinde yöneten yapıya geçmektedir. Bu dönüşümün özelliği hangisidir?", options: { A: "Entegre süreçlerin yerine tek bir üretim çizelgesi kullanmak", B: "Malzeme ihtiyacına odaklı planlamadan işletme çapında kaynak bütünleşmesine geçiş", C: "Ortak veri bütünleşmesi yerine her departman için ayrı kayıt tutmak", D: "Kapsamı finans ve insan kaynaklarından yalnızca depo yönetimine daraltmak", E: "ERP yerine yalnızca malzeme planlama kayıtlarını çoğaltmak" }, answer: "B" },
  { id: 77, text: "Bir proje ekibinde kullanıcılar, yazılım geliştiriciler ve üst yönetim farklı terimler kullanmakta, talepler birbirini tutmamaktadır. Sistem analistinin ilk katkısı ne olmalıdır?", options: { A: "Yalnızca teknik ekibin terimlerini kullanıp iş ihtiyaçlarını buna göre sadeleştirmek", B: "Farklı kullanıcı taleplerini ortak bir çerçeveye oturtmadan tek tek uygulamak", C: "Yönetim beklentilerini diğer taraflarla doğrulamadan nihai gereksinim saymak", D: "Taraflarla görüşerek ihtiyaçları ortak, açık ve doğrulanabilir tanımlara dönüştürmek", E: "İş süreçlerini incelemeyi sürdürmeden önce yalnızca arayüz prototipi hazırlamak" }, answer: "D" },

const KEY_HISTORY = "examHistory";
const KEY_PROGRESS = "examProgress";
const TOTAL = questionsData.length;
const $ = (id) => document.getElementById(id);

let cur = 0;
let answers = {};
let viewIndex = null;       // detay ekranında açık olan deneme
let lastSavedIndex = null;  // en son bitirilen deneme
let detailFilter = "all";
let screen = "exam";

/* ---------- Depolama ---------- */
function getHistory() {
  try { return JSON.parse(localStorage.getItem(KEY_HISTORY) || "[]"); } catch (e) { return []; }
}
function setHistory(h) { localStorage.setItem(KEY_HISTORY, JSON.stringify(h)); }
function saveProgress() { localStorage.setItem(KEY_PROGRESS, JSON.stringify({ answers, cur })); }
function loadProgress() {
  try {
    const p = JSON.parse(localStorage.getItem(KEY_PROGRESS) || "null");
    if (p && p.answers) { answers = p.answers; cur = Math.min(p.cur || 0, TOTAL - 1); }
  } catch (e) {}
}

/* ---------- Ekran yönetimi ---------- */
function showScreen(name) {
  screen = name;
  ["exam", "results", "history", "detail"].forEach((s) => { $(s + "Screen").hidden = (s !== name); });
  $("btnFinish").hidden = (name !== "exam");
  $("btnHistory").hidden = (name === "history" || name === "detail");
  $("bottomBar").style.display = (name === "exam") ? "" : "none";
  togglePalette(false);
  window.scrollTo(0, 0);
}

function togglePalette(force) {
  const open = (force === undefined) ? !$("palettePanel").classList.contains("open") : force;
  $("palettePanel").classList.toggle("open", open);
  $("backdrop").classList.toggle("open", open);
}

function updateBrand() {
  $("brandSub").innerText = `${getHistory().length + 1}. deneme · ${TOTAL} soru`;
}

/* ---------- Sınav ekranı ---------- */
function renderQuestion() {
  const q = questionsData[cur];
  const chosen = answers[q.id];

  $("qNumber").innerHTML = `Soru <b>${cur + 1}</b> / ${TOTAL}`;
  $("qAnswered").innerText = `${Object.keys(answers).length} cevaplandı`;
  $("progressBar").style.width = `${((cur + 1) / TOTAL) * 100}%`;
  $("qText").innerText = q.text;

  const list = $("optionsList");
  list.innerHTML = "";
  for (const [key, val] of Object.entries(q.options)) {
    const b = document.createElement("button");
    b.className = "opt";
    if (chosen) {
      b.disabled = true;
      if (key === q.answer) b.classList.add("correct");
      else if (key === chosen) b.classList.add("wrong");
    }
    const k = document.createElement("span");
    k.className = "opt-key";
    k.innerText = key;
    const t = document.createElement("span");
    t.className = "opt-text";
    t.innerText = val;
    b.append(k, t);
    b.onclick = () => selectOption(q.id, key);
    list.appendChild(b);
  }

  const fb = $("feedback");
  if (chosen) {
    fb.hidden = false;
    if (chosen === q.answer) { fb.className = "feedback ok"; fb.innerText = "Doğru cevap."; }
    else { fb.className = "feedback bad"; fb.innerText = `Yanlış. Doğru cevap: ${q.answer}`; }
  } else {
    fb.hidden = true;
  }

  const last = (cur === TOTAL - 1);
  ["prevBtn", "mPrev"].forEach((id) => { $(id).disabled = (cur === 0); });
  ["nextBtn", "mNext"].forEach((id) => { $(id).innerText = last ? "Bitir" : "Sonraki"; });

  renderPalette();
}

function selectOption(id, key) {
  if (answers[id]) return; // cevap kilitli
  answers[id] = key;
  saveProgress();
  renderQuestion();
}

function nextQuestion() {
  if (cur < TOTAL - 1) { cur++; saveProgress(); renderQuestion(); window.scrollTo(0, 0); }
  else finishExam();
}
function prevQuestion() {
  if (cur > 0) { cur--; saveProgress(); renderQuestion(); window.scrollTo(0, 0); }
}
function goTo(i) { cur = i; saveProgress(); renderQuestion(); togglePalette(false); window.scrollTo(0, 0); }

function renderPalette() {
  const grid = $("paletteGrid");
  if (!grid.children.length) {
    questionsData.forEach((q, i) => {
      const b = document.createElement("button");
      b.className = "pbtn";
      b.id = "p" + q.id;
      b.innerText = q.id;
      b.onclick = () => goTo(i);
      grid.appendChild(b);
    });
  }
  let ok = 0;
  questionsData.forEach((q, i) => {
    const b = $("p" + q.id);
    b.className = "pbtn";
    const a = answers[q.id];
    if (a) { b.classList.add(a === q.answer ? "ok" : "bad"); if (a === q.answer) ok++; }
    if (i === cur) b.classList.add("active");
  });
  $("answeredCount").innerText = `${Object.keys(answers).length}/${TOTAL}`;
}

/* ---------- Bitirme ve sonuç ---------- */
function stats(ans) {
  let correct = 0, wrong = 0, blank = 0;
  questionsData.forEach((q) => {
    const a = ans[q.id];
    if (!a) blank++; else if (a === q.answer) correct++; else wrong++;
  });
  return { correct, wrong, blank, pct: Math.round((correct / TOTAL) * 100) };
}

function feedbackText(p) {
  if (p >= 85) return "Çok iyi, konulara hakimsin.";
  if (p >= 70) return "İyi gidiyorsun. Yanlışlarını incelemeni öneririm.";
  if (p >= 50) return "Fena değil. Yanlış yaptığın konulara tekrar bak.";
  return "Biraz daha tekrar gerekiyor. Soruları inceleyip yeniden dene.";
}

function finishExam() {
  const unanswered = TOTAL - Object.keys(answers).length;
  const msg = unanswered > 0
    ? `${unanswered} soru boş. Yine de bitirmek istiyor musun?`
    : "Sınavı bitirmek istiyor musun?";
  if (!confirm(msg)) return;

  const s = stats(answers);
  const history = getHistory();
  const num = history.length + 1;
  history.push({
    attemptNumber: num,
    date: new Date().toLocaleString("tr-TR"),
    correct: s.correct, wrong: s.wrong, blank: s.blank, percentage: s.pct,
    answers: answers
  });
  setHistory(history);
  localStorage.removeItem(KEY_PROGRESS);
  lastSavedIndex = history.length - 1;

  $("resTitle").innerText = `${num}. deneme tamamlandı`;
  $("resPercent").innerText = `%${s.pct}`;
  $("resMsg").innerText = feedbackText(s.pct);
  $("resCorrect").innerText = s.correct;
  $("resWrong").innerText = s.wrong;
  $("resBlank").innerText = s.blank;
  $("newAttemptBtn").innerText = `${num + 1}. denemeye başla`;
  showScreen("results");
}

function startNewAttempt() {
  answers = {};
  cur = 0;
  localStorage.removeItem(KEY_PROGRESS);
  updateBrand();
  renderQuestion();
  showScreen("exam");
}

function backToExam() {
  updateBrand();
  renderQuestion();
  showScreen("exam");
}

/* ---------- Geçmiş ---------- */
function pctColor(p) { return p >= 70 ? "c-ok" : (p >= 50 ? "c-warn" : "c-bad"); }

function openHistory() {
  const history = getHistory();
  const list = $("historyList");
  const chart = $("chart");
  list.innerHTML = "";
  chart.innerHTML = "";
  $("chartPanel").hidden = history.length < 1;
  $("clearAllBtn").hidden = history.length < 1;

  if (history.length === 0) {
    list.innerHTML = `<div class="panel empty">Henüz tamamlanmış bir deneme yok. İlk denemeni bitirdiğinde burada görünecek.</div>`;
  }

  history.forEach((h, i) => {
    const col = document.createElement("div");
    col.className = "chart-col";
    col.innerHTML = `<em class="${pctColor(h.percentage)}">${h.percentage}</em><div class="chart-bar" style="height:${Math.max(h.percentage, 3) * 0.7}px"></div><small>${h.attemptNumber}</small>`;
    chart.appendChild(col);
  });

  history.map((h, i) => ({ h, i })).reverse().forEach(({ h, i }) => {
    const b = document.createElement("button");
    b.className = "hist-item";
    b.innerHTML = `
      <div class="hist-pct ${pctColor(h.percentage)}">%${h.percentage}</div>
      <div class="hist-main"><b>${h.attemptNumber}. Deneme</b><span>${h.date}</span></div>
      <div class="hist-counts"><span class="c-ok">${h.correct} D</span> · <span class="c-bad">${h.wrong} Y</span> · <span class="c-warn">${h.blank} B</span></div>
      <div class="chev">›</div>`;
    b.onclick = () => openDetail(i);
    list.appendChild(b);
  });

  showScreen("history");
}

function clearHistory() {
  if (confirm("Tüm deneme geçmişi silinecek. Emin misin?")) {
    localStorage.removeItem(KEY_HISTORY);
    updateBrand();
    openHistory();
  }
}

/* ---------- Deneme detayı ---------- */
function openDetail(i) {
  const h = getHistory()[i];
  if (!h) { openHistory(); return; }
  viewIndex = i;
  detailFilter = "all";

  $("dTitle").innerText = `${h.attemptNumber}. Deneme`;
  $("dPercent").innerText = `%${h.percentage}`;
  $("dDate").innerText = h.date;
  $("dCorrect").innerText = h.correct;
  $("dWrong").innerText = h.wrong;
  $("dBlank").innerText = h.blank;

  const hasDetail = !!h.answers;
  $("dNote").hidden = hasDetail;
  $("dQuestions").hidden = !hasDetail;
  if (hasDetail) renderDetailList();
  showScreen("detail");
}

function statusOf(q, ans) {
  const a = ans[q.id];
  if (!a) return "blank";
  return a === q.answer ? "ok" : "bad";
}

function renderDetailList() {
  const h = getHistory()[viewIndex];
  const ans = h.answers;
  const counts = { all: TOTAL, bad: h.wrong, ok: h.correct, blank: h.blank };
  const labels = { all: "Tümü", bad: "Yanlış", ok: "Doğru", blank: "Boş" };

  const chips = $("chips");
  chips.innerHTML = "";
  Object.keys(labels).forEach((k) => {
    const c = document.createElement("button");
    c.className = "chip" + (detailFilter === k ? " on" : "");
    c.innerText = `${labels[k]} (${counts[k]})`;
    c.onclick = () => { detailFilter = k; renderDetailList(); };
    chips.appendChild(c);
  });

  const list = $("qlist");
  list.innerHTML = "";
  const shown = questionsData.filter((q) => detailFilter === "all" || statusOf(q, ans) === detailFilter);
  if (!shown.length) {
    list.innerHTML = `<div class="panel empty">Bu filtrede soru yok.</div>`;
    return;
  }

  shown.forEach((q) => {
    const st = statusOf(q, ans);
    const chosen = ans[q.id];
    const d = document.createElement("details");
    d.className = "qcard";

    const s = document.createElement("summary");
    const no = document.createElement("span");
    no.className = "qno " + st;
    no.innerText = q.id;
    const sum = document.createElement("span");
    sum.className = "qsum";
    sum.innerText = q.text;
    s.append(no, sum);

    const body = document.createElement("div");
    body.className = "qbody";
    const opts = document.createElement("div");
    opts.className = "options";
    for (const [key, val] of Object.entries(q.options)) {
      const o = document.createElement("div");
      o.className = "opt static";
      let tag = "";
      if (key === q.answer) { o.classList.add("correct"); tag = (key === chosen) ? "Senin cevabın · Doğru" : "Doğru cevap"; }
      else if (key === chosen) { o.classList.add("wrong"); tag = "Senin cevabın"; }
      const k = document.createElement("span");
      k.className = "opt-key"; k.innerText = key;
      const t = document.createElement("span");
      t.className = "opt-text"; t.innerText = val;
      o.append(k, t);
      if (tag) { const g = document.createElement("span"); g.className = "tag"; g.innerText = tag; o.appendChild(g); }
      opts.appendChild(o);
    }
    body.appendChild(opts);
    if (!chosen) {
      const n = document.createElement("div");
      n.className = "note"; n.innerText = "Bu soruyu boş bıraktın.";
      body.appendChild(n);
    }
    d.append(s, body);
    list.appendChild(d);
  });
}

function deleteAttempt() {
  if (viewIndex === null) return;
  if (!confirm("Bu deneme silinsin mi?")) return;
  const history = getHistory();
  history.splice(viewIndex, 1);
  history.forEach((h, i) => { h.attemptNumber = i + 1; });
  setHistory(history);
  updateBrand();
  openHistory();
}

/* ---------- Başlangıç ---------- */
window.addEventListener("DOMContentLoaded", () => {
  loadProgress();
  updateBrand();
  renderQuestion();
  showScreen("exam");
});
</script>
