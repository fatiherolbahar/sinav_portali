<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sınav Portalı</title>
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="Çoklu ders destekli üniversite sınav simülatörü ve test portalı.">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Üniversite Sınav Simülatörü">
  <meta property="og:description" content="Çoklu ders destekli üniversite sınav simülatörü ve test portalı.">
  <meta property="og:image" content="assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="title"><img src="assets/logo.svg" alt="" width="32" height="32"><h1>Sınav Simülatörü</h1><span class="badge">Test Portalı</span></div>
    <button class="btn btn-danger" id="resetBtn">🗑 Tüm Geçmişi Sıfırla</button>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Hoş geldin! Hangi dersi çalışıyoruz?</h1>
      <p>Bir ders seç, denemeni çöz, gelişimini takip et.</p>
      <div class="stat-row">
        <div class="stat"><b id="sTotal">0</b><span>Toplam Deneme</span></div>
        <div class="stat"><b id="sCourses">0</b><span>Kayıtlı Ders</span></div>
        <div class="stat"><b id="sAvg">—</b><span>Ortalama Başarı</span></div>
        <div class="stat"><b id="sBest">—</b><span>En Yüksek Skor</span></div>
      </div>
    </section>

    <h2 class="section">📚 Dersler</h2>
    <div class="grid" id="courseGrid"></div>

    <h2 class="section">🕒 Genel Gelişim Özeti — Son Aktiviteler</h2>
    <div class="card table-wrap">
      <table>
        <thead><tr><th>Ders</th><th>Deneme</th><th>Tarih</th><th>D / Y / B</th><th>Başarı</th></tr></thead>
        <tbody id="recentBody"></tbody>
      </table>
    </div>
  </main>

  <script src="data/courses-manifest.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
